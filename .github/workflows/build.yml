name: Build DEX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEX_NAME: classes7.dex
  HIDDENAPI_VERSION: "6.2"
  ANDROID_PLATFORM: "android-36"
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools & platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_ENV

      - name: Download HiddenApiBypass ${{ env.HIDDENAPI_VERSION }}
        run: |
          curl -L -o hiddenapibypass.jar \
          "https://github.com/LSPosed/AndroidHiddenApiBypass/releases/download/${HIDDENAPI_VERSION}/hiddenapibypass-${HIDDENAPI_VERSION}.jar"

      - name: Compile Java to .class
        run: |
          mkdir -p build/classes
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar:hiddenapibypass.jar" \
            -d build/classes Loader.java

      - name: Convert to DEX with d8
        run: |
          mkdir -p build/dex
          $BUILD_TOOLS/d8 \
            --output build/dex \
            --lib "$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar" \
            --min-api 24 \
            build/classes/aeeL/*.class hiddenapibypass.jar

      - name: Rename DEX file
        run: |
          mv build/dex/classes.dex "build/dex/$DEX_NAME"
          ls -la build/dex/

      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex-output
          path: build/dex/${{ env.DEX_NAME }}
