name: Build DEX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEX_NAME: classes7.dex
  HIDDENAPI_VERSION: "6.2"
  ANDROID_PLATFORM: "android-36"
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install build-tools & platform
        run: |
          yes | sdkmanager "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_ENV

      - name: Download HiddenApiBypass ${{ env.HIDDENAPI_VERSION }} (AAR)
        run: |
          # Maven Central: tersedia sebagai .aar, bukan .jar
          curl -L -o hiddenapibypass.aar \
            "https://repo1.maven.org/maven2/org/lsposed/hiddenapibypass/hiddenapibypass/${HIDDENAPI_VERSION}/hiddenapibypass-${HIDDENAPI_VERSION}.aar"

      - name: Extract classes.jar from AAR
        run: |
          unzip -o hiddenapibypass.aar classes.jar -d hiddenapibypass_extracted
          ls -la hiddenapibypass_extracted/
          # Validasi bahwa file benar-benar JAR
          file hiddenapibypass_extracted/classes.jar

      - name: Compile Java to .class
        run: |
          mkdir -p build/classes
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar:hiddenapibypass_extracted/classes.jar" \
            -d build/classes Loader.java

      - name: Convert to DEX with d8
        run: |
          mkdir -p build/dex
          $BUILD_TOOLS/d8 \
            --output build/dex \
            --lib "$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar" \
            --min-api 24 \
            build/classes/aeeL/*.class hiddenapibypass_extracted/classes.jar

      - name: Rename DEX file
        run: |
          mv build/dex/classes.dex "build/dex/$DEX_NAME"
          ls -la build/dex/

      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex-output
          path: build/dex/${{ env.DEX_NAME }}
